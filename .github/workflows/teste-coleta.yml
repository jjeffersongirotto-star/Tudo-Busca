name: Testar coleta de preços
on:
  workflow_dispatch:
  push:
    branches: ['ccr-*']
    paths: ['servidor/**', '.github/workflows/teste-coleta.yml']
permissions:
  contents: write
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r servidor/requirements.txt
      - name: Diagnóstico de cupons
        working-directory: servidor
        run: python diag_cupons.py || true
      - name: Rodar coleta
        working-directory: servidor
        env:
          DIAG_CUPONS: "1"
        run: python -m coleta.orquestrador ../dados/dados.json /tmp/coleta.json
      - name: Atualizar dados iniciais no branch de trabalho
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'ccr-')
        run: |
          python -c "import json; d=json.load(open('/tmp/coleta.json')); json.dump(d, open('dados/dados.json','w'), ensure_ascii=False, indent=1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/dados.json dados/banco.json
          git diff --cached --quiet || (git commit -m "Dados iniciais: coleta completa de teste" && git push)
