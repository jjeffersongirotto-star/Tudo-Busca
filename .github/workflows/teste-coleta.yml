name: Testar coleta de preços
on:
  workflow_dispatch:
  push:
    branches: ['ccr-*']
    paths: ['servidor/**', '.github/workflows/teste-coleta.yml']
permissions:
  contents: write
jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r servidor/requirements.txt
      - name: Rodar coleta
        working-directory: servidor
        env:
          SAIDA_IMAGENS: ../dados/imagens.json
        run: python -m coleta.orquestrador ../dados/dados.json /tmp/coleta.json
      - name: Guardar fotos encontradas no branch de trabalho
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/imagens.json
          git diff --cached --quiet || (git commit -m "Fotos dos produtos encontradas na coleta de teste" && git push)
