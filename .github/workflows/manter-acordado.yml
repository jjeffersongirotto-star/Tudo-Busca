name: Manter servidor acordado

# Reserva: o app já faz ping em si mesmo a cada 10 min (servidor/keepalive.py).
# Este workflow tenta acordar o Render se ele mesmo assim dormir.
# O cron do GitHub às vezes não dispara em repositórios pouco ativos; o
# workflow_dispatch serve para rodar na mão.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar o servidor
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://tudo-busca.onrender.com/api/status || true)
            echo "Tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Servidor não respondeu com 200"
