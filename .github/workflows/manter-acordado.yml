name: Manter servidor acordado

# O plano gratuito do Render "dorme" após 15 min sem acesso.
# Este workflow acessa o site a cada 10 minutos para mantê-lo ligado.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Acessar o servidor
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://tudo-busca.onrender.com/api/status || true)
            echo "Tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "Servidor não respondeu com 200"
