name: App novo — atualização OTA (sem baixar o APK)

# A cada mudança no app (app/), gera só o código novo para Android (expo export) e publica no ramo "app-ota"
# (só a versão mais recente). O app instalado pergunta ao servidor (/api/ota/manifest) ao abrir e baixa sozinho.
# Vale para os APKs com o mesmo "runtimeVersion" do app.json; mudou algo nativo → aumente o runtimeVersion e gere um APK.
on:
  push:
    branches: [main]
    paths: ['app/**', '!app/src/versaoApp.ts', '.github/workflows/app-ota.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-ota
  cancel-in-progress: true
jobs:
  ota:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Gerar o código Android (expo export)
        run: |
          node scripts/semente.mjs
          npx expo export -p android --output-dir ../ota
          node scripts/manifesto-ota.mjs ../ota "https://raw.githubusercontent.com/${{ github.repository }}/app-ota"
      - name: Publicar no ramo app-ota
        working-directory: ota
        run: |
          git init -q
          git checkout -q -b app-ota
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Atualização OTA ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" app-ota
